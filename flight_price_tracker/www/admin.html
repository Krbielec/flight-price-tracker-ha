<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flight Price Tracker</title>
  <style>
    :root { color-scheme: light dark; font: 16px system-ui, sans-serif; }
    body { max-width: 1100px; margin: auto; padding: 24px; }
    button { font: inherit; padding: 10px 16px; cursor: pointer; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 12px; border-bottom: 1px solid #8886; }
    #status { min-height: 1.5em; }
  </style>
</head>
<body>
  <h1>Flight Price Tracker</h1>
  <p>Monitoring checks stored in S3. This panel currently supports viewing only.</p>
  <button id="refresh" type="button">Refresh</button>
  <p id="status" role="status" aria-live="polite">Loading…</p>
  <div class="table-wrap">
    <table aria-label="Monitoring checks">
      <thead><tr><th>ID</th><th>Origin</th><th>Destination</th><th>From</th><th>To</th><th>Currency</th><th>Status</th></tr></thead>
      <tbody id="checks"></tbody>
    </table>
  </div>
  <script>
    const button = document.querySelector('#refresh');
    const status = document.querySelector('#status');
    const tbody = document.querySelector('#checks');
    async function load() {
      button.disabled = true;
      tbody.replaceChildren();
      status.textContent = 'Loading…';
      try {
        const response = await fetch(new URL('api/checks', document.baseURI), {cache: 'no-store'});
        const data = await response.json();
        if (!response.ok) throw new Error(data.error?.message || 'Could not load checks.');
        for (const check of data.checks) {
          const row = tbody.insertRow();
          for (const value of [check.id, check.origin, check.destination, check.departureDateFrom,
            check.departureDateTo, check.currency, check.enabled ? 'Enabled' : 'Disabled']) {
            row.insertCell().textContent = value;
          }
        }
        status.textContent = data.checks.length ? `${data.checks.length} checks loaded.` : 'No checks configured.';
      } catch (error) {
        status.textContent = `Could not load checks: ${error.message}`;
      } finally {
        button.disabled = false;
      }
    }
    button.addEventListener('click', load);
    load();
  </script>
</body>
</html>
