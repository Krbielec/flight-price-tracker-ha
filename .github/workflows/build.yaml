name: Test and publish Home Assistant add-on

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: addon-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            image: ghcr.io/krbielec/amd64-flight-price-tracker
          - arch: aarch64
            runner: ubuntu-24.04-arm
            image: ghcr.io/krbielec/aarch64-flight-price-tracker
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            flight_price_tracker/requirements.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run mocked tests
        run: python -m pytest -q
      - name: Test admin and chart data logic
        run: node --test tests/*.test.mjs
      - name: Install browser test dependencies
        if: matrix.arch == 'amd64'
        run: |
          python -m pip install -r requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Test Lovelace card and admin editing in Chromium
        if: matrix.arch == 'amd64'
        run: |
          python tests/browser_card_smoke.py
          python tests/browser_admin_smoke.py
      - name: Read add-on version
        id: metadata
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          import re
          import yaml
          version = str(yaml.safe_load(Path("flight_price_tracker/config.yaml").read_text())["version"])
          assert re.fullmatch(r"\d+\.\d+\.\d+", version), "Expected a semantic add-on version"
          print(f"version={version}")
          PY
      - name: Build and optionally publish architecture image
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: ./flight_price_tracker
          image: ${{ matrix.image }}
          image-tags: |
            ${{ steps.metadata.outputs.version }}
            latest
            sha-${{ github.sha }}
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          version: ${{ steps.metadata.outputs.version }}

  publish-manifest:
    name: Publish multi-architecture image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Publish and sign multi-architecture manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.09.0
        with:
          architectures: '["amd64", "aarch64"]'
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: flight-price-tracker
          image-tags: |
            ${{ needs.build.outputs.version }}
            latest
            sha-${{ github.sha }}
          registry-prefix: ghcr.io/krbielec
